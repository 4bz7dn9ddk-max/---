<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف إنجاز مجموعة - التقنية الرقمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6df;--ink:#4b4a6b;--pink:#c98a93;--teal:#7fb5ae;--teal2:#a9d1cb;--purple:#7d72a8;--yellow:#e6c883;--card:rgba(255,255,255,.7);--line:#e3dcb8}
@media (prefers-color-scheme:dark){:root{--bg:#1d2729;--ink:#ece9fa;--pink:#f0b4bd;--teal:#5f9a92;--teal2:#3f6f69;--purple:#b4aae6;--yellow:#d9b866;--card:rgba(255,255,255,.07);--line:#3a4a4c}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
/* الغلاف */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 200px;overflow:hidden}
.badge{background:var(--teal2);color:#1f3b38;padding:7px 18px;border-radius:999px;font-weight:500;position:relative;z-index:3}
.hero h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-size:clamp(2.6rem,12vw,6rem);line-height:1.15;color:var(--pink);margin:18px 0 10px;position:relative;z-index:3}
.hero p{font-size:clamp(1.05rem,3.5vw,1.5rem);position:relative;z-index:3;max-width:520px}
.hint{position:absolute;bottom:190px;z-index:3;font-size:.95rem;opacity:.7;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
/* الأيقونات العائمة */
.ico{position:absolute;z-index:2;width:clamp(54px,12vw,96px);animation:float 6s ease-in-out infinite}
.ico svg{width:100%;height:auto;display:block}
.i1{top:9%;right:8%}.i2{top:14%;left:8%;animation-delay:-2s}.i3{top:46%;right:5%;animation-delay:-4s}
.i4{top:50%;left:5%;animation-delay:-1s}.i5{top:30%;left:36%;animation-delay:-3s;width:clamp(44px,9vw,70px)}
@keyframes float{50%{transform:translateY(-18px) rotate(4deg)}}
/* التموجات */
.waves{position:absolute;left:0;right:0;bottom:-1px;height:200px;z-index:1}
.waves svg{position:absolute;inset:0;width:100%;height:100%}
.waves path{transform-box:fill-box;animation:slide linear infinite}
.w1{fill:var(--teal2);opacity:.6;animation-duration:16s!important}
.w2{fill:var(--teal);opacity:.55;animation-duration:11s!important;animation-direction:reverse!important}
.w3{fill:var(--pink);opacity:.4;animation-duration:22s!important}
@keyframes slide{to{transform:translateX(-50%)}}
/* المحتوى */
section{max-width:860px;margin:0 auto;padding:60px 20px 10px}
h2{font-family:"Reem Kufi",sans-serif;font-size:1.9rem;color:var(--pink);margin-bottom:22px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.info small{display:block;opacity:.7;margin-bottom:6px}.info b{font-size:1.15rem}
.names{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.names li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;font-weight:500;font-size:1.05rem;transition:transform .25s,box-shadow .25s}
.names li:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 10px 24px rgba(125,114,168,.25)}
.names i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem;flex:none}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}
.reveal.on{opacity:1;transform:none}
footer{position:relative;margin-top:70px;height:140px;overflow:hidden}
footer .waves{height:140px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <span class="badge">ملف إنجاز جماعي</span>
  <h1>معلومات الملف</h1>
  <p>ملف إنجاز مجموعة لمادة التقنية الرقمية</p>
  <div class="hint">مرّري للأسفل ↓</div>

  <div class="ico i1"><svg viewBox="0 0 100 70"><rect x="8" y="14" width="64" height="40" rx="10" fill="#7fb5ae"/><rect x="72" y="26" width="20" height="16" rx="3" fill="#7d72a8"/><circle cx="30" cy="34" r="6" fill="#fff" opacity=".8"/></svg></div>
  <div class="ico i2"><svg viewBox="0 0 100 80"><rect x="16" y="6" width="68" height="46" rx="6" fill="#a9d1cb" stroke="#7fb5ae" stroke-width="4"/><path d="M4 62h92l-8 12H12z" fill="#7fb5ae"/></svg></div>
  <div class="ico i3"><svg viewBox="0 0 70 100"><rect x="8" y="4" width="54" height="92" rx="10" fill="#c98a93"/><rect x="15" y="14" width="40" height="34" rx="5" fill="#fff"/><g fill="#fff" opacity=".8"><circle cx="22" cy="62" r="4"/><circle cx="35" cy="62" r="4"/><circle cx="48" cy="62" r="4"/><circle cx="22" cy="76" r="4"/><circle cx="35" cy="76" r="4"/><circle cx="48" cy="76" r="4"/></g></svg></div>
  <div class="ico i4"><svg viewBox="0 0 100 80"><path d="M6 22h32l8 8h48v44H6z" fill="#e6c883"/><rect x="22" y="8" width="56" height="30" rx="4" fill="#fff" stroke="#7fb5ae" stroke-width="3"/></svg></div>
  <div class="ico i5"><svg viewBox="0 0 100 70"><path d="M26 58a18 18 0 0 1 2-36 24 24 0 0 1 46 6 15 15 0 0 1-2 30z" fill="#a9d1cb" stroke="#7fb5ae" stroke-width="3"/></svg></div>

  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path class="w3" d="M0 80C100 40 200 120 300 80S500 40 600 80 800 120 900 80 1100 40 1200 80 1400 120 1500 80 1700 40 1800 80 2000 120 2100 80 2300 40 2400 80V200H0Z"/></svg>
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path class="w1" d="M0 105C100 65 200 145 300 105S500 65 600 105 800 145 900 105 1100 65 1200 105 1400 145 1500 105 1700 65 1800 105 2000 145 2100 105 2300 65 2400 105V200H0Z"/></svg>
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path class="w2" d="M0 135C100 105 200 165 300 135S500 105 600 135 800 165 900 135 1100 105 1200 135 1400 165 1500 135 1700 105 1800 135 2000 165 2100 135 2300 105 2400 135V200H0Z"/></svg>
  </div>
</header>

<section class="reveal">
  <h2>بيانات الملف</h2>
  <div class="info">
    <div><small>المادة</small><b>التقنية الرقمية</b></div>
    <div><small>الصف</small><b>أولى ثانوي</b></div>
    <div><small>الشعبة</small><b>1</b></div>
    <div><small>معلمة المادة</small><b>عهد القحطاني</b></div>
    <div><small>العام الدراسي</small><b>1448 هـ / 2027 م</b></div>
  </div>
</section>

<section class="reveal">
  <h2>أعضاء المجموعة</h2>
  <ul class="names" id="names"></ul>
</section>

<footer aria-hidden="true">
  <div class="waves">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path class="w1" d="M0 105C100 65 200 145 300 105S500 65 600 105 800 145 900 105 1100 65 1200 105 1400 145 1500 105 1700 65 1800 105 2000 145 2100 105 2300 65 2400 105V200H0Z"/></svg>
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path class="w2" d="M0 135C100 105 200 165 300 135S500 105 600 135 800 165 900 135 1100 105 1200 135 1400 165 1500 135 1700 105 1800 135 2000 165 2100 135 2300 105 2400 135V200H0Z"/></svg>
  </div>
</footer>

<script>
const members=["دلال محمد","ديما سلطان","ريماس سلطان","شذى محمد","طيف معوض","ليان موسى","ميار طلال","نوت ظافر","نجوى عمر","يارا سلطان"];
const colors=["#c98a93","#7fb5ae","#7d72a8","#d9a066","#6d9fc4"];
document.getElementById("names").innerHTML=members.map((n,i)=>`<li class="reveal" style="transition-delay:${i*60}ms"><i style="background:${colors[i%5]}">${n[0]}</i>${n}</li>`).join("");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
</body>
</html>
